name: Cron

# Vercel Hobby restringe crons a 1/dia, asi que la cadencia real se gestiona
# desde GitHub Actions (gratis, minimo 5min). Los endpoints siguen siendo los
# mismos en Vercel y se autentican con CRON_SECRET.
#
# Aviso: en repos publicos, los workflows scheduled se DESACTIVAN tras 60 dias
# sin actividad. Cualquier push/PR resetea ese contador.
#
# LEE ESTO ANTES DE TOCAR LAS CADENCIAS
# -------------------------------------
# Los `schedule:` de abajo son una PETICION, no una garantia, y desde el
# 2026-09-01 GitHub dejo de servirla. Medido sobre la tabla `cron_runs`:
#
#             pedidos/dia   servidos hasta 31-ago   servidos desde 01-sep
#   classify       48                47                    6-7
#   broadcast      24                24                    5-7
#   ingest          8                 8                    4-5
#   cleanup         1                 1                      1
#
# Caida en seco, sin cambios en este fichero, en un repo publico (minutos
# ilimitados, no es cuota) y con los ticks que si llegan retrasados 20-50
# min sobre su hora. Es el scheduler despriorizando un repo con poca
# actividad — comportamiento best-effort documentado, no apelable.
#
# Consecuencia: classify quedo con ~18 articulos/dia de capacidad frente a
# ~45/dia entrando, la cola `pending` crecio hasta 362, todo lo clasificado
# envejecio mas alla del lookback del broadcast y los canales estuvieron
# 15 dias en silencio (ultimo post: 6-sep) sin que un solo cron fallara.
#
# Por eso los jobs YA NO HACEN UNA SOLA LLAMADA. Cada run que GitHub si
# entrega se queda vivo y llama a su endpoint N veces espaciadas
# (`.github/scripts/cron-call.sh`). El trabajo por dia deja de depender
# del numero de ticks servidos, que es justo lo que no controlamos.
#
# Si algun dia recuperas cadencia real (scheduler externo o similar),
# baja ITERATIONS a 1 y esto vuelve a comportarse como antes.

on:
  schedule:
    # Ingesta cada 3 horas en punto. Cada run cubre 2h mas via bucle.
    - cron: "0 */3 * * *"
    # Classify cada 30 minutos en `:00` y `:30`. `limit=3` es un techo
    # marcado por el TPM del free tier de Groq (8K tokens/min): medido
    # sobre articulos reales, gpt-oss-120b cuesta ~1.6K tokens (noticias
    # en ingles) y hasta ~2.1K (Hipertextual, excerpt largo en español).
    # Dimensionado contra el peor mix, no contra la media: 4 articulos de
    # Hipertextual son ~8.5K y devuelven 429. El handler ademas arranca
    # con un wall-clock budget (~52s, ver WALL_TIME_BUDGET_MS en
    # app/api/cron/classify/route.ts) y sale limpio devolviendo 200 antes
    # del cap de 60s de Vercel Hobby.
    #
    # OJO: subir `limit` NO aumenta el throughput. El techo por tick es
    # TPM x wall-clock = 8K/min x 52s ~= 4 articulos, pase lo que pase.
    # La unica palanca real es hacer MAS LLAMADAS espaciadas, que es
    # exactamente lo que hace ITERATIONS. Techo diario: el TPD de Groq
    # (200K tokens/dia ~= 108 articulos/dia).
    - cron: "*/30 * * * *"
    # Broadcast cada hora a `:05` UTC. El handler decide en runtime
    # si el reloj local Europe/Madrid esta en una ventana valida
    # (08-13 y 16-23, ver lib/broadcast/window.ts) y publica
    # exactamente 1 articulo/plataforma/llamada. Si no esta en ventana
    # bail-out limpio antes de tocar DB. DST se respeta porque la
    # conversion UTC->local se hace via `Intl.DateTimeFormat`.
    #
    # El bucle mantiene la regla de producto intacta: 1 post/hora/
    # plataforma. Lo que hace es cubrir con un solo run las horas cuyo
    # tick GitHub se salta.
    #
    # IMPORTANTE — por que `:05` y no `:30`: GitHub Actions deduplica
    # los cron triggers que coinciden en el mismo minuto. Antes este
    # cron era `30 * * * *` y colisionaba con `*/30 * * * *` (classify)
    # a las :30 de cada hora — solo uno de los dos jobs corria, y
    # perdiamos aprox la mitad de los broadcasts esperados. Mover el
    # broadcast a :05 elimina la colision con classify (:00 y :30) y
    # con ingest (:00 cada 3h). Como el `if:` del job filtra por el
    # string exacto del cron, el patron debe quedar igual aqui y en
    # el job.
    - cron: "5 * * * *"
    # Newsletter semanal: domingos a las 10:00 UTC. El handler tiene su
    # propio wall-clock budget (~52s) y un sleep de 600ms entre envios
    # para no saturar el rate-limit de Resend (2/sec en free tier).
    - cron: "0 10 * * 0"
    # Cleanup diario a las 04:00 UTC (06:00 Madrid CEST / 05:00 CET).
    # Fuera de la ventana broadcast (08-13, 16-23 local) y del primer
    # ingest del dia (00:00 UTC) para que el DELETE no race con otros
    # writers. Hard-delete de articulos failed/hidden mas viejos de
    # 7 dias — ver lib/cleanup/run.ts.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Cual cron disparar manualmente"
        required: true
        default: "classify"
        type: choice
        options:
          - ingest
          - classify
          - broadcast
          - newsletter
          - cleanup
      iterations:
        description: "Llamadas a encadenar (vacio = el valor por defecto del job). Usa esto para drenar backlog."
        required: false
        type: string
      interval_seconds:
        description: "Segundos entre llamadas (vacio = el valor por defecto del job)."
        required: false
        type: string

# Los runs ahora duran horas, asi que dos del mismo job SI pueden
# solaparse. `cancel-in-progress: true` deja que el run nuevo releve al
# viejo en vez de encolarlo indefinidamente. Cancelar a media tanda es
# seguro: cada llamada es independiente e idempotente (el indice unico
# de `article_broadcasts` y el `notExists` de la query evitan el doble
# post), y matar el curl del runner no aborta el handler ya en vuelo en
# Vercel.
concurrency:
  group: cron-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: true

jobs:
  ingest:
    name: Ingest RSS feeds
    # Solo en el schedule de cada 3h, o si el dispatch lo pide explicitamente.
    if: github.event.schedule == '0 */3 * * *' || inputs.job == 'ingest'
    runs-on: ubuntu-latest
    # 3 llamadas x 1h = ~2h de bucle, + margen.
    timeout-minutes: 140
    # `KERNELIA_PROD_URL` y `CRON_SECRET` viven como secrets del environment
    # "Production" (no como repo secrets). Sin esta linea `${{ secrets.* }}`
    # los sustituye por "" y `curl` se queja con "No host part in the URL".
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - name: Hit /api/cron/ingest
        env:
          BASE_URL: ${{ secrets.KERNELIA_PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ITERATIONS: ${{ inputs.iterations || '3' }}
          INTERVAL_SECONDS: ${{ inputs.interval_seconds || '3600' }}
        run: .github/scripts/cron-call.sh /api/cron/ingest

  classify:
    name: Classify pending articles
    if: github.event.schedule == '*/30 * * * *' || inputs.job == 'classify'
    runs-on: ubuntu-latest
    # 17 llamadas x 3min = ~51min de bucle, + margen.
    timeout-minutes: 70
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - name: Hit /api/cron/classify?limit=3
        env:
          BASE_URL: ${{ secrets.KERNELIA_PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # 3 articulos cada 180s = ~1.8K tokens/min de media, muy por
          # debajo del TPM de 8K. Bajar el intervalo sin bajar el limit
          # es lo que provoca los 429.
          ITERATIONS: ${{ inputs.iterations || '17' }}
          INTERVAL_SECONDS: ${{ inputs.interval_seconds || '180' }}
        run: .github/scripts/cron-call.sh /api/cron/classify '?limit=3'

  broadcast:
    name: Broadcast classified articles
    # `5 * * * *` for scheduled runs, or explicit dispatch. See the
    # schedule block above for why this is `:05` and not `:30`.
    if: github.event.schedule == '5 * * * *' || inputs.job == 'broadcast'
    runs-on: ubuntu-latest
    # 5 llamadas x 1h = ~4h de bucle, + margen. Tope duro de GitHub: 6h.
    timeout-minutes: 260
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - name: Hit /api/cron/broadcast
        env:
          BASE_URL: ${{ secrets.KERNELIA_PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # 1 llamada/hora = 1 post/hora/plataforma, la regla de
          # producto. Las llamadas que caen fuera de la ventana
          # Europe/Madrid son un no-op barato (bail antes de tocar DB).
          ITERATIONS: ${{ inputs.iterations || '5' }}
          INTERVAL_SECONDS: ${{ inputs.interval_seconds || '3600' }}
        # Los dispatch manuales añaden `?force=1` para saltarse la
        # ventana horaria y publicar al momento — se asume que el
        # operador sabe lo que hace. Los ticks programados omiten el
        # flag y respetan la ventana (ver lib/broadcast/window.ts).
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            .github/scripts/cron-call.sh /api/cron/broadcast '?force=1'
          else
            .github/scripts/cron-call.sh /api/cron/broadcast
          fi

  newsletter:
    name: Send weekly newsletter digest
    # Domingos a las 10:00 UTC, o dispatch manual. Sin bucle: es
    # semanal y un envio duplicado seria visible para el suscriptor.
    if: github.event.schedule == '0 10 * * 0' || inputs.job == 'newsletter'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - name: Hit /api/cron/newsletter
        env:
          BASE_URL: ${{ secrets.KERNELIA_PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: .github/scripts/cron-call.sh /api/cron/newsletter

  cleanup:
    name: Cleanup old failed/hidden articles
    # Diario a las 04:00 UTC, o dispatch manual. Sin bucle: es un unico
    # DELETE idempotente y el tick de mañana recupera cualquier fallo.
    if: github.event.schedule == '0 4 * * *' || inputs.job == 'cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - name: Hit /api/cron/cleanup
        env:
          BASE_URL: ${{ secrets.KERNELIA_PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: .github/scripts/cron-call.sh /api/cron/cleanup
